# Change prefix from Ctrl+b to Ctrl+a (easier to reach)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Reload config file easily
unbind r
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Split panes using | and - (keeps current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Enable mouse mode (clickable windows, panes, resizable)
set -g mouse on

# Use Vim keys for switching panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Vim keys in copy mode
setw -g mode-keys vi

# Start window and pane numbers at 1 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Auto-renumber windows when one is closed
set -g renumber-windows on

# Fix colors and enable true-color support (24-bit)
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*256col*:Tc"

# Don't delay escape sequences (improves vim performance inside tmux)
set -g escape-time 10

# Increase scrollback history
set -g history-limit 50000

